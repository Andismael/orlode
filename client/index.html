  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="root"></div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      // Auto-recover from stale cached chunks after a deploy.
      // When React Router lazy-loads a chunk that no longer exists on the server
      // (Firebase SPA rewrite returns index.html with MIME text/html), we force
      // a hard reload once so the new index.html + new chunk manifest is used.
      (function () {
        var reloaded = false;
        function tryReload(e) {
          var msg = (e && (e.message || (e.reason && e.reason.message))) || '';
          if (!reloaded && /Failed to fetch dynamically imported module|Loading chunk .* failed|Expected a JavaScript.*module script/i.test(msg)) {
            reloaded = true;
            // Unregister SWs + clear caches before reload to ensure freshness
            if ('caches' in window) caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k);});});
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});
            }
            setTimeout(function(){ window.location.reload(); }, 100);
          }
        }
        window.addEventListener('error', tryReload, true);
        window.addEventListener('unhandledrejection', tryReload);
      })();
    </script>
  </body>
